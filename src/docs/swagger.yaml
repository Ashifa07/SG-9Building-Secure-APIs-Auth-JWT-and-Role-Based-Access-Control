openapi: 3.0.0
info:
  title: Library API
  version: 1.0.0
  description: Library API Documentation with JWT Authentication

servers:
  - url: http://localhost:3000

# ================= SECURITY CONFIG =================
# Menambahkan ini agar tombol "Authorize" (Gembok) muncul kembali
security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Category
  - name: Publisher
  - name: Book
  - name: Author
  - name: Profile
  - name: Member
  - name: Loan

paths:

# ================= AUTH =================

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user with a specific role
      security: [] # Bebas akses tanpa token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully

  /auth/login:
    post:
      tags: [Auth]
      summary: Login to get user session and role
      security: [] # Bebas akses tanpa token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login success"
                  token:
                    type: string
                  role:
                    type: string
                    enum: [ADMIN, USER]
                    example: "ADMIN"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      responses:
        200:
          description: Logout successful

  /auth/me:
    get:
      tags: [Auth]
      summary: Get profile information of the logged-in user
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /auth/users/{id}:
    delete:
      tags: [Auth]
      summary: Delete a user by ID (Admin Only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: User deleted successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden - Admin only

