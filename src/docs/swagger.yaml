# ================= COMPONENTS =================

components:
  # Definisi Security Scheme agar Swagger bisa mengirim Header Authorization
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: "admin@library.com"
        password:
          type: string
          format: password
          example: "password123"

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@example.com"
        password:
          type: string
          format: password
        role:
          type: string
          enum: [ADMIN, USER]
          default: USER
          example: "USER"

    UserResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }

    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    CreateCategory:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Publisher:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    CreatePublisher:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Author:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    CreateAuthor:
      type: object
      required: [name]
      properties:
        name: { type: string }

    Profile:
      type: object
      properties:
        id: { type: integer }
        bio: { type: string }
        authorId: { type: integer }

    CreateProfile:
      type: object
      required: [bio, authorId]
      properties:
        bio: { type: string }
        authorId: { type: integer }

    Book:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        year: { type: integer }
        categoryId: { type: integer }
        publisherId: { type: integer }

    CreateBook:
      type: object
      required: [title, year, categoryId]
      properties:
        title: { type: string }
        year: { type: integer }
        categoryId: { type: integer }
        publisherId: { type: integer }

    Member:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }

    CreateMember:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }

    Loan:
      type: object
      properties:
        id: { type: integer }
        loanDate: { type: string, format: date-time }
        returnDate: { type: string, nullable: true }
        memberId: { type: integer }
        bookId: { type: integer }

    CreateLoan:
      type: object
      required: [memberId, bookId]
      properties:
        memberId: { type: integer }
        bookId: { type: integer }